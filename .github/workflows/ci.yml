name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate dogfood specification
        run: python skill/spec-driven-development/scripts/evidrail.py check specs/evidrail-v1.md --gate ready
      - name: Validate conversation-first specification
        run: python skill/spec-driven-development/scripts/evidrail.py check specs/evidrail-conversation-first.md --gate verified --strict
      - name: Verify traceability
        run: python skill/spec-driven-development/scripts/evidrail.py trace specs/evidrail-v1.md
      - name: Verify conversation-first traceability
        run: python skill/spec-driven-development/scripts/evidrail.py trace specs/evidrail-conversation-first.md
